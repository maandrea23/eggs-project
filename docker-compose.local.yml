# Uso local únicamente. Dailey OS no lee este archivo.
services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-brianna2026}
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-brianna-local}@db:3306/eggs_project
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: eggs_project
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-brianna-local}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD:-brianna-local}"]
      interval: 10s
      timeout: 5s
      retries: 10
